name: Podglad Flutter Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Zainstaluj Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Przygotuj strukture Flutter Web
        run: |
          flutter create --platforms=web --project-name=smart_archiwum_ai .
          flutter pub get
      - name: Analiza kodu
        run: flutter analyze
      - name: Testy
        run: flutter test
      - name: Zbuduj web dla GitHub Pages
        run: flutter build web --release --base-href /smart-archiwum-ai/
      - name: Skonfiguruj Pages
        uses: actions/configure-pages@v5
      - name: Przeslij zbudowana strone
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      - name: Opublikuj podglad
        id: deployment
        uses: actions/deploy-pages@v4
